mixed-port: 7890

allow-lan: false

mode: rule

log-level: warning

ipv6: false


dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - https://78f366.dns.nextdns.io/dns-query


tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true


rules:
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - MATCH,DIRECT
